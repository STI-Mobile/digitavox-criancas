name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Bootstrap
        run: make bootstrap

      - name: Verify formatting
        run: make format-check

      - name: Analyze
        run: make analyze

      - name: Run unit and widget tests
        run: make test

      - name: Build Android debug APK
        run: make build-android

  validate_ios:
    name: iOS tooling and integration
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Configure Ruby
        uses: ruby/setup-ruby@v1

      - name: Apply Flutter simulator log discovery fix
        run: bash tool/patch_flutter_ios_ci.sh

      - name: Validate iOS flavor selection
        run: make test-ios-tooling

      - name: Bootstrap
        run: make bootstrap

      - name: Start iPhone simulator
        id: simulator
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          result = subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True
          )
          candidates = [
              (runtime, device)
              for runtime, devices in json.loads(result)['devices'].items()
              for device in devices
              if device.get('isAvailable') and 'iPhone' in device.get('name', '')
          ]
          if not candidates:
              raise SystemExit('No available iPhone simulator.')
          candidates.sort(
              key=lambda item: tuple(int(n) for n in re.findall(r'\d+', item[0])),
              reverse=True,
          )
          _, device = next(
              (item for item in candidates if item[1]['state'] == 'Booted'), candidates[0]
          )
          simulator_id = device['udid']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'id={simulator_id}\n')
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', simulator_id], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', simulator_id, '-b'], check=True)
          PY

      - name: Run iOS integration tests
        timeout-minutes: 15
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: flutter test integration_test/app_test.dart --flavor dev -d "$SIMULATOR_ID" --verbose

      - name: Stop simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: xcrun simctl shutdown "$SIMULATOR_ID"
