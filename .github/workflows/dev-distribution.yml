name: Dev distribution

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  # Builds 1-99 are reserved for manual uploads, such as the first Play release.
  BUILD_NUMBER_BASE: 100

jobs:
  quality_gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  android:
    name: Android - Play Internal Testing
    needs: quality_gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: distribution-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Bootstrap
        run: make bootstrap

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/digitavox-dev-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          cat > android/key-dev.properties <<EOF
          storeFile=$keystore_path
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Android dev bundle
        run: |
          build_number="$((BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER))"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          make build-android-dev BUILD_NUMBER="$build_number"

      - name: Validate and record Android artifact
        run: |
          artifact=build/app/outputs/bundle/devRelease/app-dev-release.aab
          test -s "$artifact"
          unzip -tq "$artifact"
          sha256sum "$artifact" >> "$GITHUB_STEP_SUMMARY"

      - name: Save Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-dev-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/bundle/devRelease/app-dev-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.usp.digitavox_criancas.dev
          releaseFiles: build/app/outputs/bundle/devRelease/app-dev-release.aab
          tracks: internal
          status: completed
          releaseName: dev-${{ env.BUILD_NUMBER }}

  ios:
    name: iOS - TestFlight
    needs: quality_gate
    # Repository variable: environment variables are not available to job-level if.
    if: vars.IOS_DISTRIBUTION_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: distribution-dev
    env:
      MATCH_GIT_URL: https://github.com/STI-USP/iOS-certificates.git
      MATCH_GIT_BRANCH: master
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_BASE64: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Configure Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate iOS credentials
        run: |
          test -n "$MATCH_PASSWORD"
          test -n "$MATCH_GIT_BASIC_AUTHORIZATION"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY"

      - name: Bootstrap
        run: make bootstrap

      - name: Build iOS dev archive
        run: |
          build_number="$((BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER))"
          make ios-build FLAVOR=dev BUILD_NUMBER="$build_number"

      - name: Locate IPA
        id: ipa
        run: |
          ipa_path="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$ipa_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Save iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-dev-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to TestFlight
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: make ios-testflight FLAVOR=dev IPA="$IPA_PATH"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$HOME/Library/Keychains/fastlane_tmp_keychain-db"
          if [ -f "$keychain" ]; then
            security default-keychain -d user -s login.keychain-db
            security delete-keychain "$keychain"
          fi
