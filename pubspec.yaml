name: digitavox_criancas
description: Harness inicial do aplicativo acessível Digitavox Crianças.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - assets/content/demo_course.json
