name: digitavox_criancas
description: Harness inicial do aplicativo acessível Digitavox Crianças.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/open_sans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/open_sans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/open_sans/OpenSans-Bold.ttf
          weight: 700

  assets:
    - assets/content/demo_course.json
    - assets/content/integration_demo_course.json
    - assets/audio/demo/instruction_a_demo.wav
    - assets/audio/demo/technical_signal_demo.wav
    - assets/images/demo/
